name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check package.json is valid
        run: node -e "require('./package.json')"

      - name: Check index.js exports required fields
        run: |
          node -e "
            const m = require('./src/index.js');
            const required = ['serverDir','serverRoutes','widgetsDir','version'];
            for (const k of required) {
              if (!m[k]) { console.error('Missing export: ' + k); process.exit(1); }
            }
            console.log('index.js exports OK:', Object.keys(m).join(', '));
          "

      - name: Check migrate.sql has required placeholders
        run: |
          node -e "
            const sql = require('fs').readFileSync('./src/schema/migrate.sql','utf8');
            const checks = ['{model}', 'path', 'depth', 'parentId', 'WITH RECURSIVE'];
            for (const s of checks) {
              if (!sql.includes(s)) { console.error('migrate.sql missing: ' + s); process.exit(1); }
            }
            console.log('migrate.sql OK');
          "

      - name: Check widget files exist
        run: |
          for f in \
            src/widgets/CmsTreeTable.arc \
            src/widgets/CmsParentPicker.arc \
            src/server/tree.arc \
            src/schema/migrate.sql \
            src/types.d.ts \
            README.md \
            CHANGELOG.md; do
            if [ ! -f "$f" ]; then echo "Missing: $f"; exit 1; fi
            echo "OK: $f"
          done

      - name: Verify no runtime dependencies
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = Object.keys(pkg.dependencies || {});
            if (deps.length > 0) {
              console.error('arc-tree must have zero runtime dependencies. Found:', deps);
              process.exit(1);
            }
            console.log('Zero runtime dependencies confirmed.');
          "
